<div #map class="h-[60vh] sm:h-[calc(100vh-64px)]"></div>

<section
  class="h-[40vh] sm:fixed sm:w-[260px] bg-white sm:rounded sm:top-20 sm:left-10 p-5 overflow-y-scroll"
>
  <h2 class="text-xl font-bold text-black mb-2">Marcadores</h2>
  <div class="flex flex-col gap-2">
    @for (marker of markers(); track marker.id) {
 <div
  class="group form-control select-none hover:bg-gray-100 rounded-lg px-2 py-1 transition-colors"
  (click)="flyToMarker(marker.mapboxMarker.getLngLat())"
>
  <div class="label cursor-pointer flex items-center justify-between gap-2 p-1">
    <span class="label-text text-black text-xs break-all">
      {{ marker.mapboxMarker.getLngLat() | json }}
    </span>

    <div class="flex items-center gap-2 shrink-0">
      <input
        type="radio"
        name="radio-10"
        class="radio radio-sm pointer-events-none"
        [style]="{ backgroundColor: marker.mapboxMarker._color }"
        checked="checked"
      />

      <button
        type="button"
        aria-label="Eliminar marcador"
        title="Eliminar marcador"
        class="p-1.5 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 active:scale-90 transition-all duration-200 sm:opacity-0 sm:group-hover:opacity-100"
        (click)="$event.stopPropagation(); deleteMarker(marker)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
    } @empty {
      <div class="flex justify-center items-center bg-blue-100 rounded py-5">
        <p class="text-xs text-secondary">No hay marcadores</p>
      </div>
    }
  </div>
</section>
